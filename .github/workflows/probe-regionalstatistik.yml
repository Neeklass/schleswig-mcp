name: Probe Regionaldatenbank (temporary)

# One-off exploration of the GENESIS REST API of the Regionaldatenbank with the
# repository secrets: table catalogue per statistic and one sample table for
# Schleswig (AGS 01059075). Prints no credentials. Removed before merging.
on:
  push:
    branches: [etappe-2-statistik]
    paths: [.github/workflows/probe-regionalstatistik.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://www.regionalstatistik.de/genesisws/rest/2020
      REGIO_USER: ${{ secrets.REGIONALSTATISTIK_USERNAME }}
      REGIO_PASS: ${{ secrets.REGIONALSTATISTIK_PASSWORD }}
    steps:
      - name: Target tables for Schleswig
        run: |
          for t in 12411-01-01-5 12711-01-03-5 12612-01-01-5 12613-01-01-5 31111-01-02-5 31121-01-02-5 45412-01-02-5 71231-01-02-5; do
            curl -sS -m 120 -X POST "$BASE/data/tablefile" \
              -H "username: $REGIO_USER" -H "password: $REGIO_PASS" \
              --data-urlencode "name=$t" --data-urlencode 'area=all' \
              --data-urlencode 'format=ffcsv' --data-urlencode 'compress=false' \
              --data-urlencode 'regionalvariable=GEMEIN' --data-urlencode 'regionalkey=01059075' \
              --data-urlencode 'startyear=2015' --data-urlencode 'language=de' -o "$t.bin"
            if unzip -l "$t.bin" >/dev/null 2>&1; then unzip -p "$t.bin" > "$t.csv"; echo '{"Status":{"Code":0},"Object":{}}' > "$t.json"; else cp "$t.bin" "$t.json"; : > "$t.csv"; fi
            python3 - "$t" <<'PY' || true
          import json, sys, csv, io, collections, traceback
          t = sys.argv[1]
          def fail(kind, value, tb):
              print(f"::notice title={t} error::" + "".join(traceback.format_exception(kind, value, tb)).replace(chr(10), " | ")[:1500] + " || raw " + open(f"{t}.json").read()[:800].replace(chr(10)," "))
          sys.excepthook = fail
          d = json.load(open(f"{t}.json"))
          status = d.get("Status", {})
          obj = d.get("Object") or {}
          content = open(f"{t}.csv", encoding="utf-8-sig").read()
          rows = list(csv.DictReader(io.StringIO(content.lstrip("\ufeff")), delimiter=";"))
          if not rows:
              print(f"::notice title={t}::status {status.get('Code')} {status.get('Content','')[:200]} || {content[:300]}")
              sys.exit(0)
          years = sorted({r["time"][:4] for r in rows})
          nonnum = collections.Counter(r["value"] for r in rows if not r["value"].replace(".","").replace(",","").replace("-","").isdigit())
          vars_ = collections.Counter(f'{r["value_variable_code"]}={r["value_variable_label"]}[{r["value_unit"]}]' for r in rows)
          dims = [k for k in rows[0] if k.endswith("_variable_code") and k[0].isdigit()]
          dimvals = {k: sorted({r[k]+":"+r[k.replace("_code","_label")] for r in rows}) for k in dims}
          extra = {k: sorted({r[k.replace("variable_code","variable_attribute_code")]+"="+r[k.replace("variable_code","variable_attribute_label")] for r in rows})[:12] for k in dims if not k.startswith("1_")}
          print(f"::notice title={t}::status {status.get('Code')} || rows {len(rows)} || years {years[0]}-{years[-1]} ({len(years)}) || time_code {rows[0]['time_code']} || nonnumeric {dict(nonnum)} || measures {dict(vars_)} || dims {dimvals} || attrs {extra} || sample {list(rows[0].values())}"[:4000])
          PY
            true
          done
