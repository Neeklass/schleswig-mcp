name: Probe Regionaldatenbank (temporary)

# One-off exploration of the GENESIS REST API of the Regionaldatenbank with the
# repository secrets: table catalogue per statistic and one sample table for
# Schleswig (AGS 01059075). Prints no credentials. Removed before merging.
on:
  push:
    branches: [etappe-2-statistik]
    paths: [.github/workflows/probe-regionalstatistik.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://www.regionalstatistik.de/genesisws/rest/2020
      REGIO_USER: ${{ secrets.REGIONALSTATISTIK_USERNAME }}
      REGIO_PASS: ${{ secrets.REGIONALSTATISTIK_PASSWORD }}
    steps:
      - name: Catalogue with time ranges
        run: |
          for stat in 12711 71231 12411 45412 31111; do
            curl -sS -m 60 -X POST "$BASE/catalogue/tables" \
              -H "username: $REGIO_USER" -H "password: $REGIO_PASS" \
              --data-urlencode "selection=${stat}*" --data-urlencode 'area=all' \
              --data-urlencode 'pagelength=100' --data-urlencode 'language=de' -o "cat-$stat.json"
            python3 - "$stat" <<'PY' || true
          import json, sys
          stat = sys.argv[1]
          d = json.load(open(f"cat-{stat}.json"))
          rows = [f"{t['Code']} [{t.get('Time','')}]: {t['Content'][:70]}".replace(chr(10)," ") for t in (d.get("List") or [])]
          print(f"::notice title={stat}::" + " || ".join(rows)[:3800])
          PY
          done
