name: Probe Regionaldatenbank (temporary)

# One-off exploration of the GENESIS REST API of the Regionaldatenbank with the
# repository secrets: table catalogue per statistic and one sample table for
# Schleswig (AGS 01059075). Prints no credentials. Removed before merging.
on:
  push:
    branches: [etappe-2-statistik]
    paths: [.github/workflows/probe-regionalstatistik.yml]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://www.regionalstatistik.de/genesisws/rest/2020
      REGIO_USER: ${{ secrets.REGIONALSTATISTIK_USERNAME }}
      REGIO_PASS: ${{ secrets.REGIONALSTATISTIK_PASSWORD }}
    steps:
      - name: Table structure
        run: |
          curl -sS -m 60 -X POST "$BASE/metadata/table" \
            -H "username: $REGIO_USER" -H "password: $REGIO_PASS" \
            --data-urlencode 'name=12411-01-01-5' --data-urlencode 'area=all' --data-urlencode 'language=de' -o meta.json
          echo "::notice title=structure::$(python3 -c 'import json;d=json.load(open("meta.json"));print(json.dumps(d.get("Object"),ensure_ascii=False)[:3500])')"
      - name: Sample tables for Schleswig
        run: |
          for var in GEMEIN GEM GEMEINDE; do
            curl -sS -m 120 -X POST "$BASE/data/tablefile" \
              -H "username: $REGIO_USER" -H "password: $REGIO_PASS" \
              --data-urlencode 'name=12411-01-01-5' --data-urlencode 'area=all' \
              --data-urlencode 'format=ffcsv' --data-urlencode 'compress=false' \
              --data-urlencode "regionalvariable=$var" --data-urlencode 'regionalkey=01059075' \
              --data-urlencode 'startyear=2022' --data-urlencode 'language=de' \
              -D headers.txt -o sample.bin
            ct=$(grep -i '^content-type' headers.txt | tr -d '\r')
            if unzip -l sample.bin >/dev/null 2>&1; then unzip -o -q sample.bin -d "s-$var"; f=$(ls s-$var/* | head -1); else f=sample.bin; fi
            echo "::notice title=sample $var::$ct || $(head -c 2500 "$f" | tr '\r\n' '  ')"
          done
